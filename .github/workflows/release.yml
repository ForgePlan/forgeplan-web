name: release

on:
  release:
    types: [published]

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify release was cut from main
        run: |
          BRANCH="${{ github.event.release.target_commitish }}"
          if [ "$BRANCH" != "main" ]; then
            echo "::error::release was cut from '$BRANCH', expected 'main' — refusing to publish"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            template/package-lock.json

      - name: Install root devDependencies (esbuild for dist-experimental/)
        run: npm ci --no-audit --no-fund

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag (stripped v): $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::version mismatch — package.json says $PKG_VERSION, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build dist/ + dist-experimental/
        run: node scripts/build.mjs

      - name: Smoke
        run: node scripts/smoke.mjs

      - name: Inspect tarball
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
